<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Manu´s Hitster</title>

  <style>
    :root{
      --bg0:#050611;
      --bg1:#0b0f2a;
      --bg2:#140b2d;
      --card: rgba(18, 20, 40, .72);
      --card2: rgba(18, 20, 40, .55);
      --stroke: rgba(255,255,255,.10);
      --stroke2: rgba(255,255,255,.16);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.68);
      --muted2: rgba(255,255,255,.50);

      --purple:#8b5cf6;
      --purple2:#6d28d9;
      --orange:#f59e0b;
      --orange2:#fb923c;

      --shadow: 0 20px 60px rgba(0,0,0,.45);
      --shadow2: 0 10px 30px rgba(0,0,0,.35);

      --r-xl: 22px;
      --r-lg: 18px;
      --r-md: 14px;
    }

    *{ box-sizing:border-box; }
    html, body{ height:100%; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 700px at 20% 15%, rgba(139,92,246,.35), transparent 55%),
        radial-gradient(900px 600px at 80% 35%, rgba(59,130,246,.25), transparent 55%),
        radial-gradient(1000px 800px at 50% 90%, rgba(245,158,11,.18), transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg0));
      overflow-x:hidden;
    }

    /* “Party”-Feeling: dezentes Konfetti (rein CSS, damit du nicht wieder Assets suchen musst) */
    body::before{
      content:"";
      position:fixed;
      inset:-20%;
      background:
        radial-gradient(circle at 12% 18%, rgba(251,146,60,.9) 0 2px, transparent 3px),
        radial-gradient(circle at 28% 12%, rgba(139,92,246,.9) 0 2px, transparent 3px),
        radial-gradient(circle at 78% 22%, rgba(59,130,246,.9) 0 2px, transparent 3px),
        radial-gradient(circle at 90% 35%, rgba(236,72,153,.9) 0 2px, transparent 3px),
        radial-gradient(circle at 18% 66%, rgba(34,197,94,.85) 0 2px, transparent 3px),
        radial-gradient(circle at 55% 78%, rgba(245,158,11,.85) 0 2px, transparent 3px),
        radial-gradient(circle at 72% 88%, rgba(168,85,247,.85) 0 2px, transparent 3px);
      filter: blur(.2px);
      opacity:.20;
      pointer-events:none;
      transform: rotate(-6deg);
    }

    .app{
      max-width: 520px;
      margin: 0 auto;
      padding: calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
      position:relative;
    }

    /* Header */
    .topbar{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-bottom:14px;
    }
    .brand{
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .brand h1{
      margin:0;
      font-size: 42px;
      line-height: 1.05;
      letter-spacing: -0.02em;
      font-weight: 800;
      text-shadow: 0 8px 22px rgba(0,0,0,.35);
      white-space: nowrap;
    }
    .brand .sub{
      display:flex;
      align-items:center;
      gap:10px;
      color: var(--muted);
      font-size: 16px;
      font-weight: 600;
    }
    .brand .sub .note{
      font-size: 18px;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,.35));
    }
    .brand .underline{
      height: 3px;
      width: 210px;
      border-radius:999px;
      background: linear-gradient(90deg, rgba(139,92,246,.0), rgba(139,92,246,.9), rgba(245,158,11,.85), rgba(245,158,11,.0));
      opacity:.9;
    }

    /* Admin trigger in the corner */
    #adminTrigger{
      position: fixed;
      top: calc(12px + env(safe-area-inset-top));
      right: calc(12px + env(safe-area-inset-right));
      width: 44px;
      height: 44px;
      border-radius: 999px;
      border: 1px solid var(--stroke2);
      background: rgba(255,255,255,.10);
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 10px 26px rgba(0,0,0,.25);
      display: grid;
      place-items: center;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    #adminTrigger:active{ transform: scale(.96); }

    /* Cards */
    .card{
      border: 1px solid var(--stroke);
      background: linear-gradient(180deg, var(--card), rgba(10,12,28,.62));
      border-radius: var(--r-xl);
      padding: 16px;
      box-shadow: var(--shadow2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      margin: 14px 0;
    }

    .sectionTitle{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom: 12px;
    }
    .sectionTitle h2{
      margin:0;
      font-size: 22px;
      letter-spacing: -0.01em;
      font-weight: 850;
    }

    .pill{
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,.06);
      color: var(--muted);
      font-weight: 700;
      font-size: 13px;
      user-select:none;
      white-space:nowrap;
    }

    /* Rows and controls */
    .row{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      align-items:center;
    }

    select, input[type="password"]{
      width: 100%;
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,.06);
      color: var(--text);
      padding: 12px 12px;
      border-radius: 14px;
      outline: none;
      font-size: 16px;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.0);
    }
    select:focus, input[type="password"]:focus{
      border-color: rgba(139,92,246,.55);
      box-shadow: 0 0 0 3px rgba(139,92,246,.20);
    }

    .btn{
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,.08);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      min-height: 48px;
      box-shadow: 0 10px 26px rgba(0,0,0,.20);
      user-select:none;
    }
    .btn:active{ transform: scale(.98); }
    .btn[disabled]{ opacity:.45; cursor:not-allowed; transform:none; }

    .btnWide{ width:100%; }

    .btnPrimary{
      border-color: rgba(139,92,246,.55);
      background: linear-gradient(180deg, rgba(139,92,246,.95), rgba(109,40,217,.92));
      box-shadow: 0 18px 38px rgba(109,40,217,.25);
    }
    .btnPrimary:focus{ outline: none; box-shadow: 0 0 0 3px rgba(139,92,246,.22), 0 18px 38px rgba(109,40,217,.25); }

    .btnGold{
      border-color: rgba(245,158,11,.55);
      background: linear-gradient(180deg, rgba(245,158,11,.95), rgba(251,146,60,.92));
      color: rgba(20,12,0,.95);
      box-shadow: 0 18px 38px rgba(245,158,11,.20);
    }

    .btnGhost{
      background: rgba(255,255,255,.06);
    }

    .twoCol{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width:100%;
    }
    @media (max-width: 420px){
      .brand h1{ font-size: 36px; }
      .twoCol{ grid-template-columns: 1fr; }
    }

    /* Scanner panel */
    .scannerShell{
      border: 1px solid var(--stroke);
      background: rgba(0,0,0,.35);
      border-radius: var(--r-xl);
      padding: 14px;
      overflow:hidden;
      position:relative;
    }
    #video{
      width: 100%;
      border-radius: 18px;
      background: #000;
      display:block;
      aspect-ratio: 16/10;
      object-fit: cover;
    }

    .scanHint{
      position:absolute;
      inset: 14px;
      border-radius: 18px;
      display:grid;
      place-items:center;
      pointer-events:none;
      background: radial-gradient(600px 240px at 50% 40%, rgba(139,92,246,.20), transparent 60%);
    }
    .scanHint .inner{
      text-align:center;
      color: rgba(255,255,255,.78);
      font-weight: 800;
      letter-spacing: -0.01em;
      display:flex;
      flex-direction:column;
      gap:12px;
      align-items:center;
    }
    .target{
      width: 58px;
      height: 58px;
      border-radius: 16px;
      border: 2px solid rgba(139,92,246,.85);
      box-shadow: 0 0 0 6px rgba(139,92,246,.12);
      position:relative;
    }
    .target::before{
      content:"";
      position:absolute;
      inset: 12px;
      border-radius: 999px;
      background: rgba(139,92,246,.9);
      filter: blur(.2px);
    }

    /* Status / toast-ish */
    #status{
      margin-top: 12px;
      padding: 12px 12px;
      border-radius: 14px;
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,.06);
      color: var(--muted);
      font-weight: 700;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .dotOk{
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: rgba(34,197,94,.95);
      box-shadow: 0 0 0 4px rgba(34,197,94,.15);
      flex: 0 0 auto;
    }

    .muted{ color: var(--muted); }
    .tiny{ color: var(--muted2); font-size: 13px; }

    /* Audio: nicer framing */
    audio{
      width:100%;
      margin-top: 12px;
      border-radius: 14px;
      overflow:hidden;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,.35));
    }

    /* Admin overlay modal */
    #adminOverlay{
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  padding: 18px;
  z-index: 999;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

/* Falls app.js auf "block" schaltet, erzwingen wir flex fürs Zentrieren */
#adminOverlay[style*="display: block"]{
  display: flex !important;
}

    #adminModal{
      width: min(520px, 100%);
      border-radius: var(--r-xl);
      border: 1px solid var(--stroke);
      background: linear-gradient(180deg, rgba(20,18,45,.92), rgba(10,12,28,.90));
      box-shadow: var(--shadow);
      padding: 16px;
    }
    #adminModal h2{ margin:0 0 6px; font-size: 22px; font-weight: 900; }
    #adminMsg{ min-height: 18px; }

    /* QR output area */
    #qrOut{
      padding-top: 10px;
    }
    #qrOut canvas, #qrOut img{
      max-width: 100%;
      border-radius: 18px;
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,.06);
      box-shadow: 0 12px 28px rgba(0,0,0,.30);
    }

    /* Reveal area */
    #revealArea{
      border-radius: 14px;
      border: 1px dashed rgba(255,255,255,.18);
      background: rgba(255,255,255,.05);
      padding: 12px;
      color: var(--muted);
    }

    /* Utility: spacing */
    .mt8{ margin-top:8px; }
    .mt12{ margin-top:12px; }
  </style>
</head>

<body>
  <button id="adminTrigger" aria-label="Admin">⚙️</button>

  <div class="app">
    <div class="topbar">
      <div class="brand">
        <h1>Manu´s Hitster <span aria-hidden="true">🎉</span></h1>
        <div class="sub"><span class="note">🎵</span><span>Scannen. Hören. Song erraten!</span></div>
        <div class="underline" aria-hidden="true"></div>
      </div>
    </div>

    <!-- Admin Overlay -->
    <div id="adminOverlay" style="display:none;">
      <div id="adminModal">
        <h2>Admin</h2>
        <p class="muted" style="margin:0 0 10px;">PIN eingeben</p>
        <div class="row">
          <input id="adminPin" type="password" inputmode="numeric" placeholder="PIN" />
          <button class="btn btnPrimary" id="adminUnlockBtn">OK</button>
          <button class="btn btnGhost" id="adminCancelBtn">Abbrechen</button>
        </div>
        <div id="adminMsg" class="tiny mt8"></div>
      </div>
    </div>

    <!-- Admin Panel -->
    <div class="card" id="adminPanel">
      <div class="sectionTitle">
        <h2>0) Karte ziehen / QR scannen</h2>
      </div>

      <div class="row">
        <button class="btn btnGold btnWide" id="makeQrBtn">
          <span aria-hidden="true">🎲</span>
          <span>Zufällige Karte</span>
        </button>
      </div>

      <div class="row mt8">
        <button class="btn btnGhost btnWide" id="makeQrBtn_alt" style="display:none;">QR erstellen</button>
      </div>

      <!-- Falls dein JS zwingend #songSelect nutzt, lassen wir es drin,
           aber optisch versteckt, weil das UI in deinem Screenshot “Zufällig” betont. -->
      <div style="display:none;">
        <select id="songSelect"></select>
      </div>

      <div class="row mt8">
        <button class="btn btnGhost btnWide" id="makeQrBtn2" style="display:none;">QR erstellen</button>
        <button class="btn btnGhost btnWide" id="makeQrBtn3" style="display:none;">QR-Code erstellen</button>
      </div>

      <!-- Dieser Button ist für deine bestehende Logik "QR erstellen".
           Wenn app.js an #makeQrBtn hängt, bleibt alles gut. -->
      <div class="row mt8">
        <button class="btn btnGhost btnWide" id="qrCreateBtnVisual">
          <span aria-hidden="true">🔎</span>
          <span>QR-Code erstellen</span>
        </button>
      </div>

      <div id="qrOut"></div>

      <p class="tiny mt12">Screenshot machen oder ausdrucken.</p>
      <button class="btn btnGhost btnWide" id="adminLockBtn">Admin sperren</button>
    </div>

    <!-- Scanner Panel -->
    <div class="card">
      <div class="sectionTitle">
        <h2>1) Scannen &amp; Abspielen</h2>
        <div class="pill">No Spoiler</div>
      </div>

      <div class="scannerShell">
        <video id="video" playsinline></video>

        <!-- Overlay hint (dekorativ) -->
        <div class="scanHint" aria-hidden="true">
          <div class="inner">
            <div class="target"></div>
            <div>Kamera auf QR-Code richten</div>
          </div>
        </div>
      </div>

      <div class="twoCol mt12">
        <button class="btn btnPrimary" id="startScanBtn">
          <span aria-hidden="true">▶</span>
          <span>Scan starten</span>
        </button>
        <button class="btn btnGhost" id="stopScanBtn">
          <span aria-hidden="true">⏹</span>
          <span>Scan stoppen</span>
        </button>
      </div>

      <div class="twoCol mt8">
        <button class="btn btnGhost" id="revealBtn" disabled>
          <span aria-hidden="true">👁</span>
          <span>Aufdecken</span>
        </button>
        <button class="btn btnGhost" id="hideBtn" disabled>
          <span aria-hidden="true">🙈</span>
          <span>Verstecken</span>
        </button>
      </div>

      <audio id="audio" controls></audio>

      <div id="status"><span class="dotOk" aria-hidden="true"></span><span>Bereit. Scanne eine Karte um zu starten!</span></div>
      <div id="revealArea" class="mt8"></div>
    </div>
  </div>

  <script type="module">
    import QrScanner from "https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js";
    window.QrScanner = QrScanner;

    // Kleine Brücke: Der hübsche "QR-Code erstellen"-Button soll den bestehenden #makeQrBtn auslösen,
    // ohne dass du app.js anfassen musst.
    const v = document.getElementById("qrCreateBtnVisual");
    const real = document.getElementById("makeQrBtn");
    if (v && real){
      v.addEventListener("click", () => real.click());
    }
  </script>

  <script src="app.js"></script>
</body>
</html>
